<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>TM 제스처로 움직이는 캐릭터 – Fix</title>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>

  <style>
    :root { --text:#e5e7eb; --panel:#111827cc; }
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;background:#0b0f1a;color:var(--text);font-family:system-ui, -apple-system, Segoe UI, Roboto, "Apple SD Gothic Neo", "맑은 고딕"}
    #app{max-width:960px;margin:0 auto;padding:16px;height:100%;display:grid;grid-template-rows:auto 1fr auto;gap:12px}
    header{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    h1{font-size:18px;margin:0;font-weight:800}
    button, label{font-size:14px}
    #btnStart{border:0;padding:10px 14px;border-radius:10px;background:linear-gradient(135deg,#2563eb,#22d3ee);color:#fff;font-weight:700;cursor:pointer}
    #stageWrap{position:relative;border-radius:14px;overflow:hidden;outline:1px solid #334155;min-height:360px;background:#0a0f1c;box-shadow:inset 0 0 0 1px #000a,0 12px 30px #0008}
    canvas{display:block;width:100%;height:100%}
    #hud{position:absolute;left:16px;top:16px;background:var(--panel);backdrop-filter:blur(6px);border:1px solid #374151aa;border-radius:12px;padding:10px 12px;font-size:12px;min-width:200px;user-select:none;pointer-events:none}
    #hud .row{display:flex;justify-content:space-between;gap:8px}
    #hud .label{color:#9ca3af}
    #hud .chip{display:inline-block;padding:2px 8px;border-radius:999px;font-weight:700;font-size:11px;background:#052e1a;color:#86efac;border:1px solid #14532d}
    #legend{position:absolute;right:16px;top:16px;background:var(--panel);border:1px solid #374151aa;border-radius:12px;padding:10px 12px;font-size:12px}
    #legend h3{margin:0 0 6px 0;font-size:12px;opacity:.9}
    #legend .item{display:grid;grid-template-columns:64px 1fr auto;align-items:center;gap:8px}
    #legend .bar{height:8px;background:#1f2937;border-radius:6px;overflow:hidden;margin:4px 0 10px}
    #legend .bar>i{display:block;height:100%;background:linear-gradient(90deg,#22d3ee,#2563eb);width:0%}
    .videoDebug{position:absolute;bottom:12px;left:12px;padding:4px 8px;border-radius:8px;background:#0007;font-size:11px}
    #videoCanvas{position:absolute;inset:0;opacity:0;pointer-events:none} /* tm.Webcam 캔버스 숨김 */
    footer{font-size:12px;color:#94a3b8;display:grid;gap:6px}
    code.snip{background:#111827;padding:2px 6px;border-radius:6px;border:1px solid #374151}
  </style>
</head>
<body>
  <div id="app">
    <header>
      <h1>Teachable Machine 제스처 컨트롤 – 안정화 버전</h1>
      <button id="btnStart">카메라 & 모델 시작</button>
      <label><input type="checkbox" id="flipToggle" checked /> 미러(좌우 반전) 사용</label>
      <label><input type="checkbox" id="showVideo" /> 입력영상 보기</label>
    </header>

    <div id="stageWrap" aria-label="게임 화면">
      <canvas id="stage" width="960" height="540"></canvas>
      <!-- 디버그 HUD -->
      <div id="hud">
        <div class="row"><span class="label">상태</span><span class="value" id="stateChip"><span class="chip">대기</span></span></div>
        <div class="row"><span class="label">동작</span><span class="value" id="actionLabel">-</span></div>
        <div class="row"><span class="label">FPS</span><span class="value" id="fps">-</span></div>
      </div>
      <!-- 확률 막대 -->
      <div id="legend">
        <h3>예측 확률</h3>
        <div class="item"><span>left</span><div class="bar"><i id="p-left"></i></div><span id="t-left">0%</span></div>
        <div class="item"><span>right</span><div class="bar"><i id="p-right"></i></div><span id="t-right">0%</span></div>
        <div class="item"><span>jump</span><div class="bar"><i id="p-jump"></i></div><span id="t-jump">0%</span></div>
        <div class="item"><span>none</span><div class="bar"><i id="p-none"></i></div><span id="t-none">0%</span></div>
      </div>

      <!-- tmImage.Webcam이 내부적으로 관리하는 캔버스를 우리가 보여줄 수 있게 훅 -->
      <canvas id="videoCanvas"></canvas>
      <div class="videoDebug">영상 디버그</div>
    </div>

    <footer>
      <div>모델: <code class="snip">https://teachablemachine.withgoogle.com/models/EvIZbroaE/</code></div>
      <div>왼쪽/오른쪽이 반대로 나오면 ‘미러’ 체크를 바꿔보세요(학습 시 거울모드 여부와 일치해야 함).</div>
      <div>세밀 조정은 상단 코드의 <code class="snip">THRESHOLD, EMA_ALPHA, CLASS_BIAS</code>를 수정.</div>
    </footer>
  </div>

  <script>
    // ===== 설정 =====
    const MODEL_BASE = "https://teachablemachine.withgoogle.com/models/EvIZbroaE/";
    const MODEL_URL = MODEL_BASE + "model.json";
    const METADATA_URL = MODEL_BASE + "metadata.json";

    // 임계값/스무딩/바이어스 조정
    const THRESHOLD = 0.60;       // 동작 확정 임계값
    const EMA_ALPHA = 0.30;       // 확률 스무딩(클수록 반응 빠름)
    const CLASS_BIAS = {          // none 약화, jump 살짝 강화
      left: 1.00,
      right: 1.00,
      jump: 1.12,
      none: 0.82
    };

    // 물리/게임
    const SPEED = 6, FRICTION = 0.85, GRAVITY = 0.9, JUMP_POWER = 16, JUMP_COOLDOWN_MS = 500;

    // ===== 전역 =====
    let model, maxPredictions, webcam;
    let started = false;

    const canvas = document.getElementById("stage");
    const ctx = canvas.getContext("2d");
    const videoCanvas = document.getElementById("videoCanvas");
    const vctx = videoCanvas.getContext("2d");

    const fpsLabel = document.getElementById("fps");
    const actionLabel = document.getElementById("actionLabel");
    const stateChip = document.getElementById("stateChip");
    const flipToggle = document.getElementById("flipToggle");
    const showVideo = document.getElementById("showVideo");

    const barEls = {
      left:  document.getElementById("p-left"),
      right: document.getElementById("p-right"),
      jump:  document.getElementById("p-jump"),
      none:  document.getElementById("p-none"),
    };
    const pctEls = {
      left:  document.getElementById("t-left"),
      right: document.getElementById("t-right"),
      jump:  document.getElementById("t-jump"),
      none:  document.getElementById("t-none"),
    };

    const player = { x: canvas.width*0.5, y: 0, vx: 0, vy: 0, size: 44, onGround: false, lastJumpAt: 0 };
    const groundY = canvas.height - 64;

    // 확률 스무딩
    const ema = { left:0, right:0, jump:0, none:0 };

    // FPS
    let lastTime = performance.now(), frameCount = 0, fps = 0;

    // 반응형 캔버스
    function fitCanvas() {
      const wrap = document.getElementById("stageWrap");
      const w = wrap.clientWidth;
      const h = Math.max(360, Math.round(w * 9 / 16));
      canvas.width = w; canvas.height = h;
      videoCanvas.width = Math.min(640, w * 0.4);
      videoCanvas.height = Math.round(videoCanvas.width * 3 / 4);
    }
    new ResizeObserver(fitCanvas).observe(document.getElementById("stageWrap"));
    fitCanvas();
    player.y = groundY - player.size/2;

    function setChip(text) { stateChip.innerHTML = `<span class="chip">${text}</span>`; }

    document.getElementById("btnStart").addEventListener("click", init);
    flipToggle.addEventListener("change", async () => {
      if (webcam) {
        webcam.flip = flipToggle.checked;
        // flip이 바뀌면 내부 캔버스 변환 재적용을 위해 한 프레임 쉬어감
        await new Promise(r => setTimeout(r, 50));
      }
    });
    showVideo.addEventListener("change", () => {
      videoCanvas.style.opacity = showVideo.checked ? 1 : 0;
    });

    async function init() {
      if (started) return;
      setChip("카메라 준비…");
      try {
        // Teachable Machine 방식의 Webcam (flip 옵션 제공)
        webcam = new tmImage.Webcam(640, 480, flipToggle.checked); // width, height, flip
        await webcam.setup({ facingMode: "user" }); // 권한 요청
        await webcam.play();

        setChip("모델 로드…");
        model = await tmImage.load(MODEL_URL, METADATA_URL);
        maxPredictions = model.getTotalClasses();

        started = true;
        setChip("준비 완료");
        window.requestAnimationFrame(loop);
      } catch (e) {
        console.error(e);
        setChip("오류");
        alert("카메라/모델을 초기화하지 못했습니다. HTTPS 및 권한을 확인하세요.");
      }
    }

    async function loop(now) {
      // 웹캠 프레임 업데이트
      if (webcam) webcam.update();

      // FPS
      frameCount++;
      const dt = now - lastTime;
      if (dt >= 500) {
        fps = Math.round((frameCount * 1000) / dt);
        fpsLabel.textContent = String(fps);
        frameCount = 0; lastTime = now;
      }

      // 예측
      if (model && webcam) {
        try {
          const predictions = await model.predict(webcam.canvas, false);
          const probs = { left:0, right:0, jump:0, none:0 };
          for (const p of predictions) {
            const name = (p.className || "").toLowerCase();
            if (probs[name] !== undefined) probs[name] = p.probability;
          }

          // 클래스 바이어스 적용
          for (const k in probs) {
            probs[k] = Math.min(1, Math.max(0, probs[k] * (CLASS_BIAS[k] ?? 1)));
          }

          // 스무딩
          for (const k of Object.keys(ema)) {
            ema[k] = (1 - EMA_ALPHA) * ema[k] + EMA_ALPHA * (probs[k] || 0);
          }

          // UI 막대
          for (const k of ["left","right","jump","none"]) {
            const pct = Math.round((ema[k] || 0) * 100);
            barEls[k].style.width = pct + "%";
            pctEls[k].textContent = pct + "%";
          }

          // 액션 결정
          let action = "none";
          // jump는 짧아도 우선권 부여
          if (ema.jump >= 0.50) {
            action = "jump";
          } else {
            let bestK = "none", bestV = 0;
            for (const k of ["left","right","none"]) {
              if ((ema[k] || 0) > bestV) { bestV = ema[k]; bestK = k; }
            }
            action = (bestV >= THRESHOLD) ? bestK : "none";
          }

          applyAction(action);
          const conf = Math.round(Math.max(ema[action] || 0, 0) * 100);
          actionLabel.textContent = `${action} (${conf}%)`;
        } catch (e) {
          console.warn("predict error:", e);
        }
      }

      // 입력 영상 디버그 미리보기
      if (webcam) {
        vctx.save();
        vctx.clearRect(0,0,videoCanvas.width,videoCanvas.height);
        // webcam.canvas는 이미 flip 적용되었음. 그대로 축소 렌더링
        vctx.drawImage(webcam.canvas, 0, 0, videoCanvas.width, videoCanvas.height);
        vctx.restore();
      }

      // 게임 갱신/렌더
      updatePhysics();
      render();

      requestAnimationFrame(loop);
    }

    function applyAction(action) {
      if (action === "left") {
        player.vx = -SPEED;
      } else if (action === "right") {
        player.vx = SPEED;
      } else if (action === "jump") {
        const now = performance.now();
        if (player.onGround && now - player.lastJumpAt > JUMP_COOLDOWN_MS) {
          player.vy = -JUMP_POWER;
          player.onGround = false;
          player.lastJumpAt = now;
        }
      } else {
        // none → 감속
        player.vx *= FRICTION;
        if (Math.abs(player.vx) < 0.1) player.vx = 0;
      }
    }

    function updatePhysics() {
      player.vy += GRAVITY;
      player.x += player.vx;
      player.y += player.vy;

      const size = player.size;
      const bottom = groundY - size/2;
      if (player.y > bottom) { player.y = bottom; player.vy = 0; player.onGround = true; } else { player.onGround = false; }

      const minX = size/2 + 10, maxX = canvas.width - size/2 - 10;
      if (player.x < minX) { player.x = minX; player.vx = 0; }
      if (player.x > maxX) { player.x = maxX; player.vx = 0; }
    }

    function render() {
      const w = canvas.width, h = canvas.height;
      ctx.clearRect(0,0,w,h);

      const g = ctx.createLinearGradient(0,0,0,h);
      g.addColorStop(0,"#0b1222");
      g.addColorStop(1,"#0a0f1c");
      ctx.fillStyle = g; ctx.fillRect(0,0,w,h);

      // ground
      const groundYLocal = groundY;
      ctx.fillStyle = "#1f2937";
      ctx.fillRect(0, groundYLocal + 24, w, h - (groundYLocal + 24));
      ctx.fillStyle = "#334155";
      ctx.fillRect(0, groundYLocal, w, 4);

      // shadow
      const r = player.size/2, cx = player.x, cy = player.y;
      ctx.globalAlpha = 0.25;
      ctx.beginPath(); ctx.ellipse(cx, groundYLocal + 20, r*0.9, r*0.4, 0, 0, Math.PI*2); ctx.fillStyle = "#000"; ctx.fill(); ctx.globalAlpha = 1;

      // body
      const grd = ctx.createLinearGradient(cx, cy - r, cx, cy + r);
      grd.addColorStop(0, "#60a5fa"); grd.addColorStop(1, "#22d3ee");
      ctx.fillStyle = grd; ctx.strokeStyle = "#0b1020"; ctx.lineWidth = 2;
      roundRect(ctx, cx - r, cy - r, player.size, player.size, 12); ctx.fill(); ctx.stroke();

      ctx.font = `${Math.floor(player.size*0.8)}px system-ui, Apple Color Emoji, Segoe UI Emoji`;
      ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillStyle = "#0b1020";
      ctx.fillText(player.onGround ? "🕹️" : "🌀", cx, cy+1);
    }

    function roundRect(ctx, x, y, w, h, r) {
      const rr = Math.min(r, w/2, h/2);
      ctx.beginPath();
      ctx.moveTo(x+rr, y);
      ctx.arcTo(x+w, y, x+w, y+h, rr);
      ctx.arcTo(x+w, y+h, x, y+h, rr);
      ctx.arcTo(x, y+h, x, y, rr);
      ctx.arcTo(x, y, x+w, y, rr);
      ctx.closePath();
    }

    if (location.protocol !== "https:") {
      console.warn("HTTPS가 아닙니다. GitHub Pages(HTTPS)에서 테스트하세요.");
    }
  </script>
</body>
</html>
